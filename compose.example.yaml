services:
  approval-mcp:
    build: .
    restart: unless-stopped
    environment:
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET}
      DINGTALK_CALLER_USER_ID: ${DINGTALK_CALLER_USER_ID}
      DINGTALK_WRITE_USER_IDS: ${DINGTALK_WRITE_USER_IDS:-}
      APPROVAL_ALLOWED_PROCESS_CODES: ${APPROVAL_ALLOWED_PROCESS_CODES:-}
      APPROVAL_IDEMPOTENCY_LEDGER_PATH: /app/data/approval-idempotency
      APPROVAL_ATTACHMENT_BATCH_MAX_BYTES: ${APPROVAL_ATTACHMENT_BATCH_MAX_BYTES:-15728640}
      APPROVAL_BACKEND_HOST: 0.0.0.0
      APPROVAL_BACKEND_PORT: 3000
      MCP_PLATFORM_API_KEY: ${MCP_PLATFORM_API_KEY}
      APPROVAL_BACKEND_ALLOWED_HOSTS: ${APPROVAL_BACKEND_ALLOWED_HOSTS}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - approval_mcp_data:/app/data

volumes:
  approval_mcp_data:

services:
  approval-mcp:
    build: .
    restart: unless-stopped
    environment:
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET}
      DINGTALK_WRITE_USER_IDS: ${DINGTALK_WRITE_USER_IDS:-}
      APPROVAL_ALLOWED_PROCESS_CODES: ${APPROVAL_ALLOWED_PROCESS_CODES:-}
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
      MCP_HTTP_API_KEY: ${MCP_HTTP_API_KEY}
      MCP_HTTP_ALLOWED_HOSTS: ${MCP_HTTP_ALLOWED_HOSTS}
    ports:
      - "127.0.0.1:3000:3000"
